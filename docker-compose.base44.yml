# Development environment for the Base44 sandbox.
# Serves the static site from the cloned source with live reload.
#   docker compose -f docker-compose.base44.yml up -d --build
services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Dependencies live in a volume so the sandbox checkout stays clean.
      - node_modules:/app/node_modules
    environment:
      # Bare pass-throughs: the platform sets these, compose must not invent values.
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts so the preview host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    restart: on-failure
    labels:
      base44.project: "Learn to Code"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      # Probes the dev server itself, using node (always present in the image).
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  node_modules:
